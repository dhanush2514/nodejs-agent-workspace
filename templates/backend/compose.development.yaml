services:
  api:
    build:
      target: development
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://development:development-only@postgres:5432/development
      TRUST_PROXY: ${APPLICATION_SUBNET:-172.28.0.0/24}
    volumes:
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    environment:
      DATABASE_URL: postgresql://development:development-only@postgres:5432/development
  postgres:
    environment:
      POSTGRES_USER: development
      POSTGRES_DB: development
      POSTGRES_PASSWORD: development-only
  nginx:
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    volumes:
      - ./deploy/nginx/development.conf:/etc/nginx/conf.d/default.conf:ro
